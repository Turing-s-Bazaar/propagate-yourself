[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propagate-yourself"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.4.20,<0.5.0",
    "jwave>=0.2.1",
    "matplotlib>=3.11.1",
    "napari[pyqt6]>=0.9.0",
    "numpy>=2.5.2",
    "psycopg[binary]>=3.2.10",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "simpleitk>=2.5.6",
]

[project.scripts]
corpus-ingest = "graphs.corpus_ingest.cli:main"
helm-mirror = "tools.helm_mirror.cli:main"
rwx-policy = "graphs.corpus_ingest.policy_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools", "graphs"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
graph = [
    "sentence-transformers>=3.0",
]
